name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Opens (or updates) a release PR while changesets are pending.
      # `publish` is only passed once an npm token exists — without it, changesets
      # runs `changeset publish` on every push and fails trying to publish a
      # version that is not in the registry.
      - uses: changesets/action@v1
        if: ${{ secrets.NPM_TOKEN != '' }}
        with:
          version: pnpm version
          publish: pnpm release
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: changesets/action@v1
        if: ${{ secrets.NPM_TOKEN == '' }}
        with:
          version: pnpm version
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
