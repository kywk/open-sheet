name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Nothing to do until the packages are publishable. Without a token this job
    # can only open a release PR nobody can merge into a release — and doing that
    # also needs "Allow GitHub Actions to create and approve pull requests" in the
    # repository settings. Add NPM_TOKEN and enable that, and this activates.
    if: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Opens (or updates) a release PR while changesets are pending, and
      # publishes once that PR is merged.
      - uses: changesets/action@v1
        with:
          version: pnpm version
          publish: pnpm release
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
