name: web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# The page inlines a workbook the framework compiles and reads the version from
# the core package, so a core change can move the site even when apps/web has
# not been touched. That is why packages/core is in the paths above.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @open-sheet/web build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "no Cloudflare credentials; skipping (this is expected on a fork)"
            exit 0
          fi
          pnpm dlx wrangler@latest pages deploy apps/web/dist \
            --project-name=open-sheet --branch=main --commit-dirty=true
