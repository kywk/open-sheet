name: Bug report
description: Something behaves differently from what it says it does
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: workbook
    attributes:
      label: The smallest workbook that shows it
      description: >
        A `sheets/<id>/index.tsx` that reproduces the problem. Trim it as far as
        it still goes wrong — that usually identifies the cause on its own.
      render: tsx
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "@open-sheet/core 0.1.0, node 22.11, macOS 15"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it goes wrong
      options:
        - The viewer
        - The exported .xlsx
        - The exported .csv / .html / .pdf
        - The CLI
        - The MCP server
        - Somewhere else
